upstream backend {
    ip_hash;
    server backend-1:8000;
    server backend-2:8000;
}

# HTTP → HTTPS redirect for all domains
server {
    listen 80;
    server_name back.quizhub.uz grafana.quizhub.uz prometheus.quizhub.uz;
    
    return 301 https://$host$request_uri;
}

# Backend API
server {
    listen 443 ssl;
    server_name back.quizhub.uz;

    ssl_certificate /etc/letsencrypt/live/back.quizhub.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/back.quizhub.uz/privkey.pem;

    location /test {
        alias /usr/share/nginx/html;
        index ws_test.html;
    }

    location / {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400;
    }
}

# Grafana
server {
    listen 443 ssl;
    server_name grafana.quizhub.uz;

    ssl_certificate /etc/letsencrypt/live/grafana.quizhub.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/grafana.quizhub.uz/privkey.pem;

    location / {
        proxy_pass http://grafana:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

# Prometheus
server {
    listen 443 ssl;
    server_name prometheus.quizhub.uz;

    ssl_certificate /etc/letsencrypt/live/prometheus.quizhub.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/prometheus.quizhub.uz/privkey.pem;

    location / {
        proxy_pass http://prometheus:9090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}